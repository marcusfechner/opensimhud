[workspace]
resolver = "3"
members = ["crates/telemetry", "crates/ovtool", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Marcus Fechner <marcusfechner@gmx.de>"]
repository = "https://github.com/marcusfechner/opensimhud"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
telemetry = { path = "crates/telemetry" }

# Small, fast release binaries (https://tauri.app/concept/size/)
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
