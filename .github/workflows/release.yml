name: Release

# Push a tag like v0.2.0 (scripts/release.sh does it) to publish a release. The installed
# apps find it through latest.json and offer the update.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Build the signed installer
        run: npm run tauri build -- --bundles nsis --config src-tauri/tauri.release.conf.json
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: cargo build --release -p ovtool
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=target/release/bundle/nsis
          exe="OpenSimHUD_${VERSION}_x64-setup.exe"
          test -f "$dir/$exe" && test -f "$dir/$exe.sig"
          gh release create "$GITHUB_REF_NAME" --title "OpenSimHUD $VERSION" --generate-notes \
            "$dir/$exe" target/release/ovtool.exe
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$exe"
          notes=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)
          jq -n --arg v "$VERSION" --arg notes "$notes" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig "$(cat "$dir/$exe.sig")" --arg url "$url" \
            '{version: $v, notes: $notes, pub_date: $date,
              platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' > latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json
