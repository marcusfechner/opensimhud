<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="stage"></div>
    <div id="edit" hidden></div>
    <div id="banner" hidden>
      <span class="b-text"><b>Editing <span id="editing"></span></b><br />Drag to move, drag the corner to resize, hold <kbd>Alt</kbd> to skip snapping</span>
      <button id="add" class="secondary" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" /></svg>Add overlay
      </button>
      <button id="done">Done <kbd>Esc</kbd></button>
      <div id="addMenu" role="menu" hidden></div>
    </div>
    <div id="status"></div>
    <script type="module" src="/src/overlay/main.ts"></script>
  </body>
</html>
